<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! ♡</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body><div id="celebration"></div>

<main class="birthday-card">
    <p class="small-heading">A LITTLE SURPRISE FOR YOU ♡</p>

    <h1>Happy Birthday!</h1>

    <p class="subtitle" id="subtitle">
        Today is all about you. 💗
    </p>

    <div class="cake-area">
        <div class="sparkle sparkle1">✧</div>
        <div class="sparkle sparkle2">✦</div>

        <div class="candles" id="candles">
            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>

        <div class="icing"></div>

        <div class="cake">
            <span>♡　♡　♡</span>
        </div>

        <div class="plate"></div>
    </div>

    <p id="message">
        Close your eyes and get ready to make a wish! ✨
    </p>

    <button id="blowButton" type="button">
        Blow the candles 🎂
    </button>

    <button id="wishButton" class="hidden" type="button">
        Make a wish ✨
    </button>

    <p class="footer">made with love, just for you 💕</p>
</main>

</body>
</html>
